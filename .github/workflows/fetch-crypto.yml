name: Fetch Crypto Fear & Greed (Hourly)

on:
  schedule:
    - cron: '5 * * * *'   # 5 minutes past every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Crypto Fear & Greed
        id: fetch
        run: |
          python scripts/fetch_crypto.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Commit and push (only if value changed)
        if: steps.fetch.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crypto.json
          git diff --staged --quiet || git commit -m "crypto: $(date -u '+%Y-%m-%d %H:%M')"
          git push
